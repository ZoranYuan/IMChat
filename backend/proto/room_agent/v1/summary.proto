syntax = "proto3";

package room_agent.v1;

option go_package = "IM_backend/room_agent/v1;agentpb";

import "google/protobuf/timestamp.proto";

service RoomSummaryAgent {
  rpc RunSummary(SummaryRequest) returns (SummaryResponse);
  rpc ResumeSummaryState(ResumeSummaryStateRequest) returns (SummaryResponse);
}

message Scope {
  string room_id = 1;
  string user_id = 2;
}

enum SummaryAction {
  SUMMARY_ACTION_UNSPECIFIED = 0;
  SUMMARY_ACTION_START = 1;
  SUMMARY_ACTION_RETRY = 2;
  SUMMARY_ACTION_CANCEL = 3;
}

enum InterruptAction {
  INTERRUPT_ACTION_UNSPECIFIED = 0;
  INTERRUPT_ACTION_RETRY = 1;
  INTERRUPT_ACTION_CANCEL = 2;
}

enum SummaryStatus {
  SUMMARY_STATUS_UNSPECIFIED = 0;
  SUMMARY_STATUS_SUCCEEDED = 1;
  SUMMARY_STATUS_FAILED = 2;
  SUMMARY_STATUS_WAITING_USER_DECISION = 3;
}

message SummaryRequest {
  string request_id = 1;
  string summary_run_id = 2;
  Scope scope = 3;
  SummaryAction action = 4;

  // 只有 SUMMARY_ACTION_START 时传入。
  repeated RoomMessage room_messages = 5;
}

message ResumeSummaryStateRequest {
  string request_id = 1;
  string summary_run_id = 2;
  Scope scope = 3;
}

message RoomMessage {
  string room_id = 1;
  string message_id = 2;
  string sender_id = 3;
  int64 seq = 4;
  int32 type = 5;
  string content = 6;
  string status = 7;
  google.protobuf.Timestamp send_time = 8;
}

message SummaryResponse {
  string request_id = 1;
  string summary_run_id = 2;
  SummaryStatus status = 3;
  SummaryOutput summary = 4;
  ErrorInfo error = 5;
  RetryRequired retry_required = 6;
}

message SummarySegment {
  string summary_content_segment = 1;
  repeated Citation citations = 2;
}

message Citation {
  string message_id = 1;
  int64 seq = 2;
}

message SummaryOutput {
  repeated SummarySegment summary_content = 1;
}

message ErrorInfo {
  string code = 1;
  string message = 2;
}

message RetryRequired {
  string reason_code = 1;
  repeated string validation_issues = 2;
  repeated string reflection_issues = 3;
  int32 repair_count = 4;
  int32 max_repair_count = 5;
  repeated InterruptAction allowed_actions = 6;
}
