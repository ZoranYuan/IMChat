openapi: 3.0.3
info:
  title: IM Backend API
  version: 1.0.0
  description: Static OpenAPI document for the current HTTP and WebSocket contract.
servers:
  - url: /api/v1
tags:
  - name: Users
  - name: Friends
  - name: FriendRequests
  - name: Rooms
  - name: Conversations
  - name: Messages
  - name: WebSocket
paths:
  /users/register:
    post:
      tags: [Users]
      summary: Register user with phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAuthResponse'
  /users/login:
    post:
      tags: [Users]
      summary: Login user with phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAuthResponse'
  /users/logout:
    post:
      tags: [Users]
      summary: Logout current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
  /friends:
    get:
      tags: [Friends]
      summary: Get current user's friend list
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendListResponse'
  /friend-requests:
    post:
      tags: [FriendRequests]
      summary: Create friend request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRequestCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestCreateResponse'
    get:
      tags: [FriendRequests]
      summary: List current user's friend requests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestListResponse'
  /friend-requests/actions:
    post:
      tags: [FriendRequests]
      summary: Accept or reject friend request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRequestActionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /rooms:
    post:
      tags: [Rooms]
      summary: Create room
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomCreateResponse'
  /rooms/{roomId}/invite-code:
    get:
      tags: [Rooms]
      summary: Get or refresh invite code
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResponse'
  /rooms/join:
    post:
      tags: [Rooms]
      summary: Join room by invite code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomJoinRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomJoinResponse'
  /conversations:
    get:
      tags: [Conversations]
      summary: List current user's conversations
      description: >-
        Returns the conversation sidebar snapshot, including the latest message
        and unread count for each private or room conversation. Call this after
        login, during page initialization, after a manual refresh, and after a
        successful WebSocket reconnect. This endpoint does not return every
        message received while offline; load a conversation's messages through
        `/messages/history` when the user opens it.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conversation list ordered by latest message time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
  /messages/history:
    get:
      tags: [Messages]
      summary: Get message history
      description: >-
        Loads messages for one selected conversation. Use cursor `0` to load
        the latest page after opening a conversation, then use `nextCursor` for
        older pages.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: conversationId
          required: true
          schema:
            type: string
        - in: query
          name: cursor
          schema:
            type: integer
            format: int64
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageHistoryResponse'
  /messages/sync:
    get:
      tags: [Messages]
      summary: Sync offline messages
      description: >-
        Returns all messages after `afterSeq` up to the conversation's current
        latest sequence. This endpoint is for offline synchronization and is
        not paginated.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: conversationId
          required: true
          schema:
            type: string
        - in: query
          name: afterSeq
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSyncResponse'
  /ws:
    get:
      tags: [WebSocket]
      summary: WebSocket endpoint
      description: Connect with Authorization header `Bearer <token>`.
      security:
        - bearerAuth: []
      responses:
        '101':
          description: Switching Protocols
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BaseResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
    SuccessResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              nullable: true
    StringResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
    UserRegisterRequest:
      type: object
      required: [phone, password, reconfirmPassword, loginType]
      properties:
        phone:
          type: string
        password:
          type: string
        reconfirmPassword:
          type: string
        loginType:
          type: integer
    UserLoginRequest:
      type: object
      required: [loginType]
      properties:
        loginType:
          type: integer
        phone:
          type: string
        password:
          type: string
        userName:
          type: string
    UserAuthData:
      type: object
      properties:
        token:
          type: string
        userId:
          type: string
        username:
          type: string
        nickName:
          type: string
        phone:
          type: string
        avatar:
          type: string
    UserAuthResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserAuthData'
    UserInfo:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        nickName:
          type: string
        phone:
          type: string
        avatar:
          type: string
    UserInfoResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserInfo'
    FriendItem:
      type: object
      properties:
        friendUserId:
          type: string
        friendAvatar:
          type: string
        status:
          type: integer
        dsipalyName:
          type: string
    FriendListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FriendItem'
    FriendRequestCreateRequest:
      type: object
      required: [toUserId, message]
      properties:
        toUserId:
          type: string
        message:
          type: string
    FriendRequestItem:
      type: object
      properties:
        requestId:
          type: string
        toUserId:
          type: string
        message:
          type: string
        status:
          type: integer
        applyTime:
          type: integer
          format: int64
    FriendRequestCreateResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FriendRequestItem'
    FriendRequestListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FriendRequestItem'
    FriendRequestActionRequest:
      type: object
      required: [requestId, action]
      properties:
        requestId:
          type: string
        action:
          type: integer
          enum: [1, 2]
    RoomCreateRequest:
      type: object
      required: [roomName]
      properties:
        roomName:
          type: string
        description:
          type: string
        avatar:
          type: string
    RoomCreateData:
      type: object
      properties:
        roomId:
          type: string
        description:
          type: string
        roomName:
          type: string
        avatar:
          type: string
        memberCount:
          type: integer
        inviteCode:
          type: string
    RoomCreateResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RoomCreateData'
    RoomJoinRequest:
      type: object
      required: [inviteCode]
      properties:
        inviteCode:
          type: string
    RoomJoinData:
      type: object
      properties:
        roomId:
          type: string
        description:
          type: string
        roomName:
          type: string
        avatar:
          type: string
        memberCount:
          type: integer
        role:
          type: integer
        joinTime:
          type: integer
          format: int64
    RoomJoinResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RoomJoinData'
    ConversationPeerUser:
      type: object
      properties:
        userId:
          type: string
        userName:
          type: string
        nickName:
          type: string
        remark:
          type: string
        avatar:
          type: string
    ConversationRoom:
      type: object
      properties:
        roomId:
          type: string
        roomName:
          type: string
        avatar:
          type: string
        description:
          type: string
        memberCount:
          type: integer
    ConversationLatestMessage:
      type: object
      properties:
        messageId:
          type: string
        conversationId:
          type: string
        senderId:
          type: string
        seq:
          type: integer
          format: int64
        convType:
          type: integer
          enum: [1, 2]
          description: 1 means private chat; 2 means room chat.
        cType:
          type: integer
          description: Message content type.
        content:
          type: string
        sendTime:
          type: integer
          format: int64
    ConversationItem:
      type: object
      required:
        - conversationId
        - convType
        - targetId
        - displayName
        - avatar
        - unread
        - isMuted
      properties:
        conversationId:
          type: string
        convType:
          type: integer
          enum: [1, 2]
          description: 1 means private chat; 2 means room chat.
        targetId:
          type: string
          description: Peer user ID for private chat, or room ID for room chat.
        displayName:
          type: string
        avatar:
          type: string
        unread:
          type: integer
          format: int64
          minimum: 0
        lastMessage:
          $ref: '#/components/schemas/ConversationLatestMessage'
        peerUser:
          allOf:
            - $ref: '#/components/schemas/ConversationPeerUser'
          description: Present only when convType is 1.
        room:
          allOf:
            - $ref: '#/components/schemas/ConversationRoom'
          description: Present only when convType is 2.
        isMuted:
          type: boolean
          description: Whether notifications are muted for the current user.
    ConversationListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ConversationItem'
    MessageItem:
      type: object
      properties:
        messageId:
          type: string
        conversationId:
          type: string
        senderId:
          type: string
        clientMsgId:
          type: string
        seq:
          type: integer
          format: int64
        cType:
          type: integer
        content:
          type: string
        videoId:
          type: string
        videoTime:
          type: integer
          format: int64
        status:
          type: integer
        attachmentId:
          type: string
        fileId:
          type: string
        fileName:
          type: string
        fileSize:
          type: integer
          format: int64
        mimeType:
          type: string
        mediaUrl:
          type: string
        thumbUrl:
          type: string
        width:
          type: integer
        height:
          type: integer
        durationMs:
          type: integer
          format: int64
        stickerId:
          type: string
        packId:
          type: string
        sendTime:
          type: integer
          format: int64
    MessageHistoryData:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageItem'
        nextCursor:
          type: integer
          format: int64
        hasMore:
          type: boolean
    MessageHistoryResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageHistoryData'
    MessageSyncData:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageItem'
    MessageSyncResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageSyncData'
